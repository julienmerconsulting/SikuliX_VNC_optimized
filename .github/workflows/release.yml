name: Build and Release

# Stable release workflow — twin of release-rc.yml without the -rc bits.
# Runs only on explicit dispatch or when something is pushed to the
# release/oculix branch. Guards against running on a pre-release version
# (pom.xml version must be plain X.Y.Z, no -rc/-beta/-alpha suffix).
# Produces the API and IDE fat jars for Windows, macOS and Linux, plus the
# two platform-independent modules, MCP and Reporter, and publishes a GitHub
# release with the "latest" pointer pointing here - so users pulling
# /releases/latest land on this stable release.
#
# Reporter is a GitHub asset only. Its pom sets maven.deploy.skip under the
# release profile, so the Maven Central publication stays untouched by this.

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/oculix'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install API to local repo
      run: mvn -B -pl API install -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Build API fat JAR (Windows)
      run: mvn -B -pl API -P complete-win-jar package -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Build IDE fat JAR (Windows)
      run: mvn -B -pl IDE -P complete-win-jar package -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Build MCP fat JAR
      run: mvn -B -pl MCP -P mcp-fatjar package -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-jars
        path: |
          API/target/*complete-win*.jar
          IDE/target/*complete-win*.jar
          MCP/target/oculix-mcp-server.jar

  build-macos:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install API to local repo
      run: mvn -B -pl API install -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Build API fat JAR (macOS)
      run: mvn -B -pl API -P complete-mac-jar package -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Build IDE fat JAR (macOS)
      run: mvn -B -pl IDE -P complete-mac-jar package -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Build MCP fat JAR
      run: mvn -B -pl MCP -P mcp-fatjar package -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-jars
        path: |
          API/target/*complete-mac*.jar
          IDE/target/*complete-mac*.jar
          MCP/target/oculix-mcp-server.jar

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install API to local repo
      run: mvn -B -pl API install -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Build API fat JAR (Linux)
      run: mvn -B -pl API -P complete-lux-jar package -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Build IDE fat JAR (Linux)
      run: mvn -B -pl IDE -P complete-lux-jar package -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Build MCP fat JAR
      run: mvn -B -pl MCP -P mcp-fatjar package -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-jars
        path: |
          API/target/*complete-lux*.jar
          IDE/target/*complete-lux*.jar
          MCP/target/oculix-mcp-server.jar

  # Reporter carries no natives, so it is built once instead of in each of the
  # three OS jobs. It is a thin jar on purpose: oculixapi is `provided` and the
  # framework integrations are `optional`, so it goes on the classpath next to
  # the API jar the user already has.
  build-reporter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install API to local repo
      run: mvn -B -pl API install -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Build Reporter JAR
      run: mvn -B -pl Reporter package -DskipTests | egrep -v "^\[INFO\].*?Download.*?http"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: reporter-jar
        path: Reporter/target/oculixreporter-*.jar

  release:
    needs: [build-windows, build-macos, build-linux, build-reporter]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Get version from POM
      id: version
      run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

    - name: Verify stable version
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Version $VERSION is not a stable X.Y.Z release"
          echo "::error::Use the RC workflow (release-rc.yml) for -rc / -beta / -alpha / -SNAPSHOT versions"
          exit 1
        fi
        echo "Stable version confirmed: $VERSION"

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: List downloaded artifacts
      run: find . -name "*.jar" -not -path "./.m2/*" | sort

    - name: Prepare release assets
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        mkdir -p release-assets

        # OS-specific API + IDE fat jars
        find windows-jars -name "*complete-win*" -exec cp {} release-assets/ \;
        find macos-jars -name "*complete-mac*" -exec cp {} release-assets/ \;
        find linux-jars -name "*complete-lux*" -exec cp {} release-assets/ \;

        # MCP is cross-platform: one jar, but uploaded from each matrix
        # build. Grab the first one found and rename with version suffix.
        MCP_JAR=$(find windows-jars macos-jars linux-jars -name "oculix-mcp-server.jar" | head -1)
        if [ -n "$MCP_JAR" ]; then
          cp "$MCP_JAR" "release-assets/oculix-mcp-server-${VERSION}.jar"
        else
          echo "::warning::MCP jar not found in any artifact"
        fi

        # Reporter is cross-platform too, and comes from its own single build,
        # so there is nothing to deduplicate and no rename to do: the version
        # is already in the file name.
        find reporter-jar -name "oculixreporter-*.jar" -exec cp {} release-assets/ \;

        cd release-assets
        for f in *-complete-win.jar; do mv "$f" "${f%-complete-win.jar}-windows.jar"; done
        for f in *-complete-mac.jar; do mv "$f" "${f%-complete-mac.jar}-macos.jar"; done
        for f in *-complete-lux.jar; do mv "$f" "${f%-complete-lux.jar}-linux.jar"; done
        echo "=== Release assets ==="
        ls -lh

    - name: Extract release notes from CHANGELOG.md
      id: notes
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        NOTES_FILE="release-notes-${VERSION}.md"
        FALLBACK="OculiX ${VERSION}"

        if [ -f CHANGELOG.md ]; then
          awk -v ver="$VERSION" -v vver="v$VERSION" '
            /^## / {
              if (found) exit
              if (index($0, "[" vver "]") > 0 || index($0, "[" ver "]") > 0) {
                found = 1
                next
              }
            }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
        fi

        if [ ! -s "$NOTES_FILE" ]; then
          echo "::warning::No section for $VERSION found in CHANGELOG.md, using fallback notes"
          echo "$FALLBACK" > "$NOTES_FILE"
        fi

        echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_OUTPUT"
        echo "=== Release notes preview (first 40 lines) ==="
        head -40 "$NOTES_FILE"

    - name: Create release if it does not exist
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        TAG="v${VERSION}"
        NOTES_FILE="${{ steps.notes.outputs.NOTES_FILE }}"
        if ! gh release view "$TAG" > /dev/null 2>&1; then
          gh release create "$TAG" \
            --title "OculiX ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --target master
        else
          gh release edit "$TAG" --notes-file "$NOTES_FILE"
        fi

    - name: Upload assets to release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="v${{ steps.version.outputs.VERSION }}"
        gh release upload "$TAG" release-assets/*.jar --clobber
