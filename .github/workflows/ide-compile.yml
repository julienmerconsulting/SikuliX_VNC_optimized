name: Compile IDE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'API/**'
      - 'IDE/**'
      - 'pom.xml'
      - '.github/workflows/ide-compile.yml'

permissions:
  contents: read

jobs:
  ide-compile:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Maven
      run: |
        set -o pipefail
        mvn -B -pl IDE -am compile | egrep -v "^\[INFO\].*?Download.*?http"
